# xcodegen spec：.xcodeproj 是生成物，不进 git，不要手改
name: TrainingRecord
options:
  bundleIdPrefix: com.phx
  # 界面文案只有中文：声明中文为开发语言，系统才会以中文解析本 App 的日期等格式。
  developmentLanguage: zh-Hans
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    # 全局强调色取 Asset Catalog 里的 AccentColor（DESIGN.md §1 的 tint）。
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "6.0"
packages:
  TrainingRecordCore:
    path: .
targets:
  TrainingRecord:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        # 目前没有 App 图标：xcodegen 对 application target 默认要求名为 AppIcon 的图标集，置空以免 actool 报错。
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: TrainingRecordCore
        product: TrainingRecordCore
      - package: TrainingRecordCore
        product: TrainingRecordPersistence
schemes:
  TrainingRecord:
    build:
      targets:
        TrainingRecord: all
